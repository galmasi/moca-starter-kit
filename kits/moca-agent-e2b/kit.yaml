schemaVersion: v1
id: moca-agent
name: Moca E2B sandbox agent v0.3
description: >-
  Claude Code agent running on a custom container image using a remote sandbox
category: software
icon: wrench
image:
  ref: ghcr.io/galmasi/moca-claude-agent:0.3
  harness: claude-code
  providers: [anthropic, curve-bender, ibm-litellm]
resources:
  cpu: "2"
  memory: 4Gi
  storage: 5Gi

connections:
  - accepts: [anthropic, curve-bender]
  - accepts: [custom-header]
    note: API token for e2btest2
  
egressPreset: trusted
egressRules:
  - host: "*.e2btest2.ete14.res.ibm.com"
    port: 443
    verdict: allow
  - host: 9.2.130.16
    port: 443
    verdict: allow

seed:
  self: true

bundledSkills:
  path: .agents/skills
